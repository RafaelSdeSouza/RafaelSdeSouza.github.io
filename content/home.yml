research_objects:
  - research_ref: resolved-galaxies
    title: Coherent regions in resolved galaxies
    href: research.html#resolved-galaxies
    citation:
      label: de Souza et al. (2025)
      url: https://doi.org/10.1093/mnras/staf688
      note: CAPIVARA · Fig. 2
    summary: >-
      CAPIVARA groups spaxels by spectral similarity and maps them back onto the
      galaxy. In five MaNGA systems, the recovered regions were coherent in
      continuum and emission-line properties without imposing a bulge–disc
      decomposition.
  - research_ref: spectropath
    title: Spectra as ordered geometric objects
    href: research.html#spectropath
    citation:
      label: spectropath · 2026
      url: https://arxiv.org/abs/2606.27432
      note: Current work
      note_url: research.html#current-work
    summary: >-
      Spectral lines with similar widths can differ in absorption, asymmetry and
      the ordering of their components. spectropath describes these differences
      through a path in velocity–flux space.
  - research_ref: milky-way
    title: A high-pitch-angle structure in the Milky Way
    href: research.html#milky-way
    citation:
      label: Kuhn et al. (2021)
      url: https://doi.org/10.1051/0004-6361/202141198
      note: A&A 651, L10 · Fig. 3
    summary: >-
      Twenty-five star-forming regions trace a narrow structure about one
      kiloparsec long, inclined by approximately 56 degrees to the Galactic
      azimuth.

