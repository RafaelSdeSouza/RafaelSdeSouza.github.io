title: Cosmostatistics Initiative
founded: 2014
mark: assets/images/coin-2024.png
intro:
  - >-
    I founded COIN in 2014 for joint research on astronomical and statistical
    problems. At its residences, small groups live together and work on a few
    research projects.
  - COIN is co-led by Emille E. O. Ishida, Alberto Krone-Martins and me.
