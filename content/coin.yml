first_residence:
  city: Lisbon
  year: 2014
  summary: >-
    At the first COIN residence, separate projects used binomial and gamma
    regression for primordial star formation and photometric redshifts, and
    approximate Bayesian computation for cosmological inference from cluster
    counts.
  outputs:
    - label: Binomial regression
      url: https://doi.org/10.1016/j.ascom.2015.04.002
    - label: Gamma regression
      url: https://doi.org/10.1016/j.ascom.2015.01.002
    - label: COSMOABC
      url: https://doi.org/10.1016/j.ascom.2015.09.001

