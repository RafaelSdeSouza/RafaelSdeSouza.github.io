opening:
  - Astronomy asks us to reconstruct causes from systems we cannot manipulate and histories we cannot replay.
  - >-
    I want to know when observations distinguish between physical explanations—and
    when the distinction has instead been supplied by the assumptions we bring to
    the data.

current_questions:
  - id: incomplete-calibration
    title: Inference beyond observed support
    status: In development
    body:
      - >-
        When the target population occupies regions absent from the calibration
        sample, reweighting can alter the mixture only within observed support. I
        am studying which population quantities remain bounded under explicit
        restrictions on the missing conditional law and how those bounds change
        when limited information about the unobserved population is introduced.
  - id: representation-completion
    title: What the representation leaves behind
    status: In development
    body:
      - >-
        A representation learned for reconstruction or prediction may discard
        variation needed to estimate a physical parameter. The experiments
        separate losses introduced by the representation from errors introduced
        by the downstream estimator, testing whether the retained coordinates
        support physical measurements beyond the task used for training.

sections:
  - id: spectropath
    status: Preprint and released package
    year: 2026
    title: Spectra as ordered geometric objects
    layout: scientific-plate
    body:
      - >-
        spectropath represents a spectral line as an ordered path in velocity–flux
        space. In synthetic tests, its descriptors distinguish profiles with
        similar widths and low-order moments. Applied to MaNGA Hα spectra, they
        identify spatially coherent regions of similar line morphology.
    figure:
      src: assets/images/research/spectropath-toy-case.png
      alt: Normalised line profiles and comparisons of their widths and shape coordinates in the spectropath toy case
      width: 3960
      height: 900
      role: primary
      caption: Normalised line profiles, line widths and shape coordinates in the spectropath toy case.
      aria_label: View full-size spectropath figure
    links:
      - {label: Preprint, url: https://arxiv.org/abs/2606.27432}
      - {label: Documentation, url: https://rafaelsdesouza.com.br/spectropath/}
      - {label: GitHub, url: https://github.com/RafaelSdeSouza/spectropath}

  - id: radialpaths
    status: Preprint and released package
    year: 2026
    title: Radial structure beyond a single centre
    layout: object-left
    body:
      - >-
        In a multi-centred source, the radial location assigned to a feature
        depends on the chosen centre. RadialPaths measures distance through the
        source footprint and retains each position’s centre assignment. In two
        JADES DR2 systems, the F277W profiles remained stable under modest
        footprint changes and one-pixel shifts of the centres.
    figure:
      src: assets/images/research/radialpaths-multicentre-construction.png
      alt: RadialPaths figure comparing intensity, centre assignments, relative depth and radial profiles for four source geometries
      width: 2803
      height: 2582
      role: secondary
      caption: Centre assignments, relative depth and radial profiles for circular, irregular and multi-centred sources. RadialPaths, Fig. 1.
      aria_label: View full-size RadialPaths figure
    links:
      - {label: Preprint, url: https://arxiv.org/abs/2608.26326}
      - {label: Documentation, url: https://rafaelsdesouza.com.br/radialpaths/}
      - {label: GitHub, url: https://github.com/RafaelSdeSouza/radialpaths}

  - id: resolved-current
    status: Published methods; extensions in development
    title: Coherent structure in resolved galaxies
    layout: compact
    body:
      - >-
        Moving from individual galaxies to larger IFU and multiband samples tests
        whether spectro-spatial segmentation recovers comparable stellar
        populations and emission-line regions. The tests examine CAPIVARA and
        SAGUI under these conditions and compare spatially regularised spectral
        decompositions with changes in the observed spectra and galactic
        structure.
    links:
      - {label: CAPIVARA and resolved galaxies, url: '#resolved-galaxies', class: direct-link}

  - id: resolved-galaxies
    year: 2025
    title: From pixels to coherent physical regions
    layout: scientific-plate
    body:
      - >-
        Independent spaxel fits ignore spatial coherence, while bins constructed
        only to reach a target signal-to-noise ratio need not follow changes in the
        continuum or emission lines.
      - >-
        Spatial models reconstructed IFU fields while accounting for dependence
        between neighbouring locations. CAPIVARA grouped spaxels by spectral
        similarity and returned the groups to their positions in the galaxy. In
        five MaNGA systems, it recovered regions coherent in continuum and
        emission-line properties without imposing a bulge–disc decomposition.
        SAGUI extended the same spectro-spatial principle to multiband images.
    figure:
      src: assets/images/research/capivara-segmentation.png
      alt: Five MaNGA galaxy images above their spectral segmentation maps
      width: 1040
      height: 561
      role: primary
      caption: Galaxy images and segmentation maps from de Souza et al. (2025), Fig. 2.
      caption_link: {label: CAPIVARA paper, url: https://doi.org/10.1093/mnras/staf688}
      aria_label: View full-size CAPIVARA segmentation figure
    links:
      - {label: Spatial field reconstruction, url: https://doi.org/10.1093/mnras/sty2881}
      - {label: CAPIVARA, url: https://doi.org/10.1093/mnras/staf688}
      - {label: SAGUI, url: https://doi.org/10.1093/mnras/stag1062}
      - {label: SpectralUnmix, url: https://doi.org/10.3847/2515-5172/ae5107}

  - id: galaxy-populations
    title: Galaxy populations across mass and environment
    layout: quiet
    body:
      - >-
        A Bayesian negative-binomial model separated the expected number of
        globular clusters from excess count variation. Studies of nuclear star
        clusters found stellar mass to be the principal predictor of nucleation,
        with environment contributing a secondary effect. J-PLUS imaging expanded
        the globular-cluster candidate sample around the M81 group.
      - >-
        Ultraviolet-bright red-sequence galaxies were compared across redshift and
        stellar mass. In jellyfish galaxies, resolved spectral modelling measured
        how star formation and stellar populations vary with mass and stripping
        intensity.
    links:
      - {label: Globular-cluster counts, url: https://doi.org/10.1093/mnras/stv1825}
      - {label: Coma nuclear star clusters, url: https://doi.org/10.1093/mnras/stab2348}
      - {label: J-PLUS globular clusters, url: https://doi.org/10.1093/mnras/stac2002}
      - {label: UV-upturn galaxies, url: https://doi.org/10.1093/mnras/stz3609}
      - {label: Jellyfish galaxies, url: https://doi.org/10.1093/mnras/stad1641}

  - id: milky-way
    year: 2021
    title: Reconstructing the Milky Way from incomplete tracers
    layout: object-left
    body:
      - >-
        Gaia astrometry identified new nearby open clusters and showed that even
        the population within roughly one kiloparsec remained incomplete. SPICY
        extended the census to young stars obscured at optical wavelengths,
        identifying roughly 120,000 candidates from mid-infrared photometry.
      - >-
        Their spatial distribution supported the identification of 25
        star-forming regions in a narrow structure about one kiloparsec long. Its
        pitch angle of approximately 56 degrees is substantially larger than the
        value normally assigned to the Sagittarius arm. Analyses of
        Solar-neighbourhood stars inferred their birth radii. In Gaia-ESO thin-disc
        dwarfs, survival analysis associated lithium depletion with temperature,
        metallicity and age, with little additional dependence on migration
        direction.
    figure:
      src: assets/images/research/milky-way.png
      alt: Map of star-forming regions in the Galactic plane showing the high-pitch-angle structure associated with the Sagittarius arm
      role: secondary
      caption: The star-forming structure in the Galactic plane. Kuhn et al. (2021), A&A 651, L10, Fig. 3.
      caption_link: {label: Paper, url: https://doi.org/10.1051/0004-6361/202141198}
      aria_label: View full-size Milky Way spatial map
    links:
      - {label: Gaia open clusters, url: https://doi.org/10.1051/0004-6361/201834453}
      - {label: SPICY, url: https://doi.org/10.3847/1538-4365/abe465}
      - {label: Sagittarius structure, url: https://doi.org/10.1051/0004-6361/202141198}
      - {label: Stellar birth radii, url: https://doi.org/10.1051/0004-6361/202453034}
      - {label: Lithium depletion, url: https://doi.org/10.1051/0004-6361/202554305}

  - id: transients
    title: From spectral diversity to transient discovery
    layout: historical-object
    body:
      - >-
        Supernova spectra are heterogeneous in phase and wavelength coverage,
        while subtype labels reduce continuous spectral diversity to a few
        categories. DRACULA used transfer learning, nonlinear dimensional
        reduction and clustering to compare Type Ia spectra observed under
        different conditions. The resulting groups occupied parts of a largely
        continuous distribution rather than isolated clusters.
      - >-
        For Type II supernovae, a graph connecting 1,595 spectra from 145 objects
        exposed outliers and temporal evolution without imposing fixed class
        boundaries. Spectra changed rapidly near maximum light and became more
        homogeneous toward the plateau end. ELEPHANT searched Fink alerts for
        extragalactic transients without detected hosts. GLADE+ provided a galaxy
        catalogue for gravitational-wave counterpart searches.
    figure:
      src: assets/images/research/spectral-classification.png
      alt: Graph representation connecting Type II supernova spectra at maximum light
      width: 768
      height: 768
      role: secondary
      caption: Graph representation of Type II supernovae at maximum light. de Souza et al. (2023).
      caption_link: {label: Paper, url: https://doi.org/10.1016/j.ascom.2023.100715}
      aria_label: View full-size Type II supernova graph
    links:
      - {label: DRACULA, url: https://doi.org/10.1093/mnras/stw1228}
      - {label: Type II spectral network, url: https://doi.org/10.1016/j.ascom.2023.100715}
      - {label: GLADE+ catalogue, url: https://doi.org/10.1093/mnras/stac1443}
      - {label: Fink, url: https://doi.org/10.1051/0004-6361/202245340}
      - {label: ELEPHANT, url: https://doi.org/10.1051/0004-6361/202450535}

  - id: survey-calibration
    title: Learning from selective samples
    layout: quiet
    body:
      - >-
        A held-out spectroscopic sample can resemble the training set while both
        differ from the photometric population to which an estimator will be
        applied. The Teddy and Happy catalogues separated two causes of failure:
        missing colour–magnitude support and changes in measurement errors or
        selection within covered regions.
      - >-
        We treated spectroscopic follow-up as a sequential decision: after each
        observation, the candidate pool, class information, observing cost and
        remaining telescope time change. RESSPECT tested those decisions under
        simulated survey conditions. The limitation that now interests me is more
        severe: further observations within the covered region cannot identify
        what happens in parts of the target population with no spectroscopic
        support.
    links:
      - {label: Photometric-redshift validation, url: https://doi.org/10.1093 pokeStyles/g least'}
