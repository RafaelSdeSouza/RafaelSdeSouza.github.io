name: Validate public site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/lint_public_copy.py
      - run: python3 scripts/build_site.py --output _site
      - run: python3 scripts/lint_public_copy.py --root _site
